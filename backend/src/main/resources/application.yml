server:
  port: 8080

spring:
  application:
    name: blog-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: blog
    password: blog123456
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      # 上传体积上限放宽（实际存储仍受用户配额约束）
      max-file-size: 6GB
      max-request-size: 6GB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

blog:
  jwt:
    # 生产环境请务必更换此密钥
    secret: blog-jwt-secret-key-2024-please-change-in-production-9f3a
    expire-hours: 72
  site:
    title: 我的博客
    subtitle: 记录技术与生活
    author: 博主
  upload:
    # 上传文件存储目录（相对后端运行目录，即项目根 uploads），按用户名分目录
    dir: ../uploads
    # 图片单文件最大 500MB
    max-size: 524288000
    # 视频单文件最大 5GB
    video-max-size: 5368709120
  # RSS 中的站点地址（部署到服务器后请改为实际域名）
  site-url: http://localhost:8080
  # 普通用户默认存储配额（字节），默认 1GB
  quota-default: 1073741824

logging:
  level:
    com.blog: info
